<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>プリクラ初号機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=DotGothic16&family=Yuji+Syuku&family=Reggae+One&family=Hachi+Maru+Pop&family=RocknRoll+One&display=swap" rel="stylesheet">
<style>
:root{
  --pk:#FF3D9A;--cy:#00E5FF;--yw:#FFE135;--pu:#B14AED;
  --gn:#39FF14;--og:#FF6B1A;--bg:#0A0018;--dk:#1A0033;
  --card:rgba(255,255,255,0.04);--border:rgba(255,61,154,0.25);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow-x:hidden;}
body{background:var(--bg);font-family:'Zen Maru Gothic',sans-serif;color:#fff;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 20% 30%,rgba(177,74,237,.15) 0%,transparent 60%),radial-gradient(ellipse 50% 60% at 80% 70%,rgba(255,61,154,.12) 0%,transparent 60%),radial-gradient(ellipse 40% 30% at 50% 10%,rgba(0,229,255,.08) 0%,transparent 50%);pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:8px 10px 40px;}

/* HEADER */
.hdr{text-align:center;padding:12px 0 6px;}
.hdr-logo{font-family:'Reggae One',sans-serif;font-size:2.4rem;letter-spacing:6px;background:linear-gradient(90deg,var(--pk),var(--yw),var(--cy),var(--pu),var(--pk));background-size:300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite;filter:drop-shadow(0 0 12px rgba(255,61,154,.6));}
.hdr-sub{font-family:'DotGothic16',monospace;font-size:.58rem;color:var(--cy);letter-spacing:5px;margin-top:2px;opacity:.8;}
@keyframes shimmer{0%{background-position:0%}100%{background-position:300%}}
.deco-bar{height:2px;background:linear-gradient(90deg,transparent,var(--pk),var(--cy),var(--yw),transparent);margin:8px 0;border-radius:2px;animation:shimmer 3s linear infinite;background-size:300%;}

/* STEPS */
.steps{display:flex;justify-content:center;align-items:center;gap:0;margin:6px 0;}
.step{display:flex;flex-direction:column;align-items:center;gap:3px;}
.step-circle{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:900;color:rgba(255,255,255,.3);transition:all .3s;}
.step-label{font-size:.52rem;color:rgba(255,255,255,.3);letter-spacing:1px;transition:all .3s;}
.step.active .step-circle{background:var(--yw);border-color:var(--yw);color:var(--bg);box-shadow:0 0 12px var(--yw);}
.step.active .step-label{color:var(--yw);}
.step.done .step-circle{background:var(--gn);border-color:var(--gn);color:var(--bg);}
.step.done .step-label{color:var(--gn);}
.step-line{width:36px;height:2px;background:rgba(255,255,255,.1);margin-bottom:14px;}

/* PANEL */
.panel{display:none;animation:fadeIn .35s ease;}
.panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* CARD */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;backdrop-filter:blur(12px);}
.card.cy{border-color:rgba(0,229,255,.22);}
.card.yw{border-color:rgba(255,225,53,.22);}

/* LABEL */
.slabel{font-family:'DotGothic16',monospace;font-size:.6rem;color:var(--cy);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.slabel::before{content:'◆';color:var(--pk);font-size:.48rem;}

/* ===== PANEL 0: SIZE SELECT ===== */
.size-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;}
.size-card{border:2px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 8px;cursor:pointer;text-align:center;transition:all .25s;background:rgba(255,255,255,.03);}
.size-card:hover{border-color:var(--pk);background:rgba(255,61,154,.08);}
.size-card.sel{border-color:var(--pk);background:rgba(255,61,154,.12);box-shadow:0 0 14px rgba(255,61,154,.35);}
.size-icon{margin:0 auto 8px;border:2.5px solid currentColor;border-radius:4px;transition:all .25s;}
.size-card.sel .size-icon{border-color:var(--pk);}
.size-card:not(.sel) .size-icon{border-color:rgba(255,255,255,.3);}
.size-name{font-size:.72rem;font-weight:700;margin-bottom:3px;}
.size-desc{font-family:'DotGothic16',monospace;font-size:.55rem;color:rgba(255,255,255,.45);}
.size-card.sel .size-name{color:var(--pk);}

/* FRAME PICKER */
.frame-picker{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.fbtn{padding:5px 11px;border-radius:20px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);font-size:.66rem;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;transition:all .2s;font-weight:700;}
.fbtn:hover{border-color:var(--pk);color:var(--pk);}
.fbtn.sel{background:var(--pk);border-color:var(--pk);color:#fff;box-shadow:0 0 10px rgba(255,61,154,.5);}

/* CAMERA */
.cam-outer{display:flex;justify-content:center;margin-bottom:8px;}
.cam-wrap{position:relative;border-radius:12px;overflow:hidden;background:#000;border:2px solid var(--pk);box-shadow:0 0 20px rgba(255,61,154,.35),inset 0 0 30px rgba(0,0,0,.6);}
#videoEl{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
.cam-corners .corner{position:absolute;width:18px;height:18px;border-color:var(--cy);border-style:solid;opacity:.9;}
.corner.tl{top:6px;left:6px;border-width:2.5px 0 0 2.5px;}
.corner.tr{top:6px;right:6px;border-width:2.5px 2.5px 0 0;}
.corner.bl{bottom:6px;left:6px;border-width:0 0 2.5px 2.5px;}
.corner.br{bottom:6px;right:6px;border-width:0 2.5px 2.5px 0;}
.countdown-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);font-family:'Reggae One',sans-serif;font-size:6rem;color:var(--yw);text-shadow:0 0 40px var(--yw);pointer-events:none;opacity:0;z-index:10;transition:opacity .15s;}
.flash-ov{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:20;transition:opacity .08s;}

/* IN-CAMERA SHUTTER BTN */
.cam-shutter-wrap{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:15;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cam-shutter-wrap:active .shutter-svg{transform:scale(.88);}
.shutter-svg{width:64px;height:64px;transition:transform .1s;filter:drop-shadow(0 0 10px rgba(255,61,154,.8));}

/* ZOOM SLIDER */
.zoom-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:0 2px;}
.zoom-label{font-family:'DotGothic16',monospace;font-size:.58rem;color:rgba(255,255,255,.4);letter-spacing:2px;flex-shrink:0;width:30px;}
.zoom-val{font-family:'DotGothic16',monospace;font-size:.58rem;color:var(--pk);flex-shrink:0;width:32px;text-align:right;}
.zslider{-webkit-appearance:none;flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18);outline:none;}
.zslider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--pk);cursor:pointer;box-shadow:0 0 6px var(--pk);}

/* THUMBS */
.thumbs{display:flex;gap:5px;justify-content:center;margin-bottom:10px;}
.tslot{border-radius:6px;border:2px dashed rgba(255,255,255,.15);background:rgba(0,0,0,.3);overflow:hidden;position:relative;flex-shrink:0;}
.tslot img{width:100%;height:100%;object-fit:cover;}
.tslot .tnum{position:absolute;top:2px;left:3px;font-size:.48rem;color:rgba(255,255,255,.5);font-family:'DotGothic16',monospace;}
.tslot.done{border-color:var(--gn);border-style:solid;}
.tslot.cur{border-color:var(--yw);border-style:solid;animation:pulseY .9s ease infinite;}
@keyframes pulseY{0%,100%{box-shadow:0 0 4px var(--yw);}50%{box-shadow:0 0 14px var(--yw);}}

/* SHOOT BTN */
.shoot-btn{width:100%;padding:13px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--pk),var(--pu));color:#fff;font-size:.92rem;font-weight:900;font-family:'Reggae One',sans-serif;cursor:pointer;letter-spacing:4px;box-shadow:0 0 18px rgba(255,61,154,.5);transition:all .2s;position:relative;overflow:hidden;}
.shoot-btn:hover{box-shadow:0 0 28px rgba(255,61,154,.7);}
.shoot-btn:active{transform:scale(.97);}
.shoot-btn:disabled{opacity:.4;cursor:not-allowed;}
.shoot-btn span{position:relative;z-index:1;}
.pcounter{text-align:center;font-family:'DotGothic16',monospace;font-size:.63rem;color:rgba(255,255,255,.45);margin-top:5px;letter-spacing:2px;}

/* NAV */
.nav-row{display:flex;gap:8px;margin-top:10px;}
.nbtn{flex:1;padding:9px;border-radius:30px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);color:#fff;font-size:.72rem;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;font-weight:700;letter-spacing:1px;transition:all .2s;}
.nbtn:hover{border-color:var(--pk);}
.nbtn.next{background:linear-gradient(135deg,var(--pk),var(--pu));border-color:transparent;box-shadow:0 0 14px rgba(255,61,154,.45);}
.nbtn.next:hover{box-shadow:0 0 24px rgba(255,61,154,.7);}
.nbtn:disabled{opacity:.35;cursor:not-allowed;}

/* ===== DECO PANEL ===== */
/* Single photo editor */
.deco-single{display:flex;justify-content:center;margin-bottom:8px;}
.deco-cv-wrap{position:relative;border-radius:10px;overflow:hidden;border:2px solid var(--cy);box-shadow:0 0 16px rgba(0,229,255,.3);cursor:crosshair;}
#decoCanvas{display:block;}

/* Photo nav */
.photo-nav{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:8px;}
.pnav-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.pnav-btn:hover{border-color:var(--pk);background:rgba(255,61,154,.15);}
.pnav-btn:disabled{opacity:.3;cursor:not-allowed;}
.photo-dots{display:flex;gap:5px;}
.pdot{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;font-family:'DotGothic16',monospace;font-size:.55rem;color:rgba(255,255,255,.4);cursor:pointer;transition:all .2s;}
.pdot.active{border-color:var(--yw);background:var(--yw);color:var(--bg);box-shadow:0 0 8px var(--yw);}
.pdot.done{border-color:var(--gn);color:var(--gn);}

/* Deco tools */
.tool-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.ti{flex:1;min-width:100px;padding:7px 11px;border-radius:8px;border:1.5px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;font-family:'Zen Maru Gothic',sans-serif;font-size:.82rem;outline:none;transition:border-color .2s;}
.ti:focus{border-color:var(--cy);}
.ta-btn{padding:7px 14px;border-radius:20px;border:none;background:linear-gradient(135deg,var(--cy),var(--pu));color:#fff;font-size:.72rem;font-weight:bold;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,.3);transition:all .2s;flex-shrink:0;}
.ta-btn:hover{transform:scale(1.05);}
.clr-btn{padding:6px 10px;border-radius:20px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.5);font-size:.68rem;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;transition:all .2s;}
.clr-btn:hover{border-color:var(--og);color:var(--og);}

.swatches{display:flex;gap:4px;flex-wrap:wrap;}
.sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;flex-shrink:0;}
.sw:hover,.sw.sel{border-color:#fff;transform:scale(1.25);box-shadow:0 0 6px rgba(255,255,255,.5);}
.fslider{-webkit-appearance:none;width:85px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);outline:none;}
.fslider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--pk);cursor:pointer;box-shadow:0 0 5px var(--pk);}

.font-sel-wrap{display:flex;gap:5px;flex-wrap:wrap;}
.font-btn{padding:4px 9px;border-radius:12px;border:1.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:rgba(255,255,255,.7);font-size:.68rem;cursor:pointer;transition:all .2s;}
.font-btn:hover{border-color:var(--cy);}
.font-btn.sel{background:var(--cy);border-color:var(--cy);color:var(--bg);}

/* BG picker */
.bg-picker{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.bgcol{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;flex-shrink:0;}
.bgcol:hover,.bgcol.sel{border-color:#fff;transform:scale(1.2);box-shadow:0 0 8px rgba(255,255,255,.4);}
.bgcol-custom{position:relative;overflow:hidden;background:conic-gradient(#ff3d9a,#ffe135,#00e5ff,#b14aed,#ff3d9a);border-radius:50%;width:22px;height:22px;border:2px solid rgba(255,255,255,.3);cursor:pointer;flex-shrink:0;}
.bgcol-custom input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}

/* STAMPS */
.stamp-grid{display:flex;gap:5px;flex-wrap:wrap;}
.ostamp{width:44px;height:44px;border-radius:8px;cursor:pointer;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;overflow:hidden;}
.ostamp:hover{border-color:var(--pk);transform:scale(1.12);box-shadow:0 0 8px rgba(255,61,154,.4);}
.ostamp svg{width:30px;height:30px;pointer-events:none;}

/* Drag hint */
.drag-hint{font-family:'DotGothic16',monospace;font-size:.52rem;color:rgba(0,229,255,.55);text-align:center;margin-bottom:5px;letter-spacing:1px;}

/* Selected item indicator */
.sel-item-label{font-family:'DotGothic16',monospace;font-size:.55rem;color:var(--yw);text-align:center;margin-bottom:4px;min-height:14px;}

/* PRINT */
.print-wrap{display:flex;justify-content:center;margin-bottom:14px;}
#printCanvas{border-radius:10px;box-shadow:0 0 30px rgba(255,61,154,.5),0 0 60px rgba(0,229,255,.2),0 8px 32px rgba(0,0,0,.5);max-width:100%;height:auto;}
.act-btns{display:flex;gap:8px;flex-wrap:wrap;}
.abtn-p{flex:1;min-width:120px;padding:12px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--yw),var(--og));color:var(--bg);font-size:.82rem;font-weight:900;font-family:'Reggae One',sans-serif;cursor:pointer;letter-spacing:3px;box-shadow:0 0 18px rgba(255,225,53,.5);transition:all .2s;}
.abtn-p:hover{transform:scale(1.03);box-shadow:0 0 28px rgba(255,225,53,.7);}
.abtn-s{flex:1;min-width:120px;padding:12px;border-radius:50px;border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);color:#fff;font-size:.78rem;font-weight:700;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;letter-spacing:2px;transition:all .2s;}
.abtn-s:hover{border-color:var(--pk);color:var(--pk);}

.star-deco{text-align:center;font-family:'DotGothic16',monospace;font-size:.68rem;color:var(--yw);letter-spacing:4px;opacity:.6;margin:8px 0;}

/* iOS tip */
.ios-tip{font-family:'DotGothic16',monospace;font-size:.55rem;color:rgba(255,225,53,.6);text-align:center;margin-top:8px;line-height:1.8;letter-spacing:.5px;}

/* TIMER TOGGLE */
.timer-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
.timer-label{font-family:'DotGothic16',monospace;font-size:.6rem;color:rgba(255,255,255,.45);letter-spacing:2px;flex-shrink:0;}
.timer-toggle{display:flex;gap:4px;}
.tbtn{padding:5px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);font-size:.65rem;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;transition:all .2s;font-weight:700;}
.tbtn:hover{border-color:var(--cy);color:var(--cy);}
.tbtn.sel{background:var(--cy);border-color:var(--cy);color:var(--bg);box-shadow:0 0 8px rgba(0,229,255,.4);}

/* MORU TOGGLE */
.moru-row{display:flex;align-items:center;gap:10px;margin-top:6px;}
.moru-label{font-family:'DotGothic16',monospace;font-size:.6rem;color:rgba(255,255,255,.45);letter-spacing:2px;flex-shrink:0;}
.moru-toggle{display:flex;gap:4px;}
.mbtn{padding:5px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);font-size:.65rem;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;transition:all .2s;font-weight:700;}
.mbtn:hover{border-color:var(--pk);color:var(--pk);}
.mbtn.sel{background:var(--pk);border-color:var(--pk);color:#fff;box-shadow:0 0 8px rgba(255,61,154,.4);}
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <div class="hdr-logo">プリクラ初号機</div>
</div>
<div class="deco-bar"></div>

<div class="steps">
  <div class="step active" id="s0"><div class="step-circle">0</div><div class="step-label">サイズ</div></div>
  <div class="step-line"></div>
  <div class="step" id="s1"><div class="step-circle">1</div><div class="step-label">撮影</div></div>
  <div class="step-line"></div>
  <div class="step" id="s2"><div class="step-circle">2</div><div class="step-label">デコる</div></div>
  <div class="step-line"></div>
  <div class="step" id="s3"><div class="step-circle">3</div><div class="step-label">完成</div></div>
</div>
<div class="deco-bar"></div>

<!-- ===== PANEL 0: SIZE ===== -->
<div class="panel active" id="p0">
  <div class="card">
    <div class="slabel">写真サイズを選ぼう</div>
    <div class="size-grid" id="sizeGrid">
      <div class="size-card sel" data-w="360" data-h="360" data-ratio="1">
        <div class="size-icon" style="width:44px;height:44px;"></div>
        <div class="size-name">スクエア</div>
        <div class="size-desc">1:1</div>
      </div>
      <div class="size-card" data-w="360" data-h="480" data-ratio="portrait">
        <div class="size-icon" style="width:36px;height:48px;"></div>
        <div class="size-name">縦型</div>
        <div class="size-desc">3:4</div>
      </div>
      <div class="size-card" data-w="480" data-h="360" data-ratio="landscape">
        <div class="size-icon" style="width:48px;height:36px;"></div>
        <div class="size-name">横型</div>
        <div class="size-desc">4:3</div>
      </div>
    </div>
  </div>
  <div class="nav-row">
    <button class="nbtn next" onclick="goPanel(1)">撮影へ</button>
  </div>
</div>

<!-- ===== PANEL 1: CAMERA ===== -->
<div class="panel" id="p1">
  <div class="card">
    <div class="slabel">フレームを選ぼう</div>
    <div class="frame-picker" id="framePicker">
      <button class="fbtn sel" data-frame="heart">ハート</button>
      <button class="fbtn" data-frame="star">スター</button>
      <button class="fbtn" data-frame="flower">フラワー</button>
      <button class="fbtn" data-frame="rainbow">レインボー</button>
      <button class="fbtn" data-frame="cyber">サイバー</button>
      <button class="fbtn" data-frame="none">なし</button>
    </div>
    <div class="cam-outer">
      <div class="cam-wrap" id="camWrap">
        <video id="videoEl" autoplay playsinline muted></video>
        <div class="cam-corners">
          <div class="corner tl"></div><div class="corner tr"></div>
          <div class="corner bl"></div><div class="corner br"></div>
        </div>
        <div class="countdown-ov" id="cdOv"></div>
        <div class="flash-ov" id="flashOv"></div>
        <!-- カメラ内シャッターボタン -->
        <div class="cam-shutter-wrap" id="camShutterBtn" onclick="startCD()">
          <svg class="shutter-svg" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="sg1" cx="40%" cy="35%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#FF3D9A"/></radialGradient>
              <radialGradient id="sg2" cx="40%" cy="30%"><stop offset="0%" stop-color="#FFE135"/><stop offset="100%" stop-color="#FF6B1A"/></radialGradient>
              <filter id="sgGlow"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <!-- カメラ本体 -->
            <rect x="6" y="18" width="52" height="36" rx="7" fill="#1A0033" stroke="#FF3D9A" stroke-width="2"/>
            <!-- レンズ外枠 -->
            <circle cx="32" cy="36" r="13" fill="#0D0018" stroke="#FF3D9A" stroke-width="2.5"/>

// ─────────────────────────────────
// FRAME DRAW
// ─────────────────────────────────
function drawFrame(ctx,w,h,fr){
  if(fr==='none') return;
  ctx.save();
  if(fr==='heart'){
    ctx.strokeStyle='#FF3D9A';ctx.lineWidth=Math.floor(h*.038);
    ctx.shadowColor='#FF3D9A';ctx.shadowBlur=10;
    const lw=ctx.lineWidth/2;
    ctx.strokeRect(lw,lw,w-lw*2,h-lw*2);
    ctx.shadowBlur=0;
    const fs=Math.floor(Math.min(w,h)*.07);
    ctx.font=`${fs}px serif`;
    const p=fs*.3;
    [[p,p],[w-fs-p,p],[p,h-fs-p],[w-fs-p,h-fs-p],[w/2-fs/2,p],[w/2-fs/2,h-fs-p]].forEach(([x,y])=>ctx.fillText('💗',x,y+fs));
  } else if(fr==='star'){
    ctx.strokeStyle='#FFE135';ctx.lineWidth=Math.floor(h*.033);
    ctx.shadowColor='#FFE135';ctx.shadowBlur=14;
    const lw=ctx.lineWidth/2;
    ctx.strokeRect(lw,lw,w-lw*2,h-lw*2);
    ctx.shadowBlur=0;
    const fs=Math.floor(Math.min(w,h)*.065);
    ctx.font=`${fs}px serif`;
    [[4,4],[w/2-fs/2,4],[w-fs-4,4],[4,h/2-fs/2],[w-fs-4,h/2-fs/2],[4,h-fs-4],[w/2-fs/2,h-fs-4],[w-fs-4,h-fs-4]].forEach(([x,y])=>ctx.fillText('⭐',x,y+fs));
  } else if(fr==='flower'){
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#FF3D9A');g.addColorStop(.5,'#FFE135');g.addColorStop(1,'#B14AED');
    ctx.strokeStyle=g;ctx.lineWidth=Math.floor(h*.035);
    const lw=ctx.lineWidth/2;ctx.strokeRect(lw,lw,w-lw*2,h-lw*2);
    const fs=Math.floor(Math.min(w,h)*.065);ctx.font=`${fs}px serif`;
    [[4,4],[w/3,4],[2*w/3,4],[w-fs-4,4],[4,h/3],[4,2*h/3],[w-fs-4,h/3],[w-fs-4,2*h/3],[4,h-fs-4],[w/3,h-fs-4],[2*w/3,h-fs-4],[w-fs-4,h-fs-4]].forEach(([x,y])=>ctx.fillText('🌸',x,y+fs));
  } else if(fr==='rainbow'){
    ['#FF0000','#FF7700','#FFEE00','#00CC00','#0088FF','#8800FF'].forEach((c,i)=>{
      ctx.strokeStyle=c;ctx.lineWidth=3;ctx.strokeRect(4+i*3,4+i*3,w-(8+i*6),h-(8+i*6));
    });
    const fs=Math.floor(Math.min(w,h)*.08);ctx.font=`${fs}px serif`;
    ctx.fillText('🌈',6,h-6);ctx.fillText('🌈',w-fs-6,fs+4);
  } else if(fr==='cyber'){
    ctx.strokeStyle='#00E5FF';ctx.lineWidth=Math.floor(h*.028);
    ctx.shadowColor='#00E5FF';ctx.shadowBlur=20;
    const lw=ctx.lineWidth/2;ctx.strokeRect(lw,lw,w-lw*2,h-lw*2);
    ctx.shadowBlur=0;ctx.strokeStyle='#B14AED';ctx.lineWidth=2.5;
    ctx.setLineDash([8,4]);ctx.strokeRect(14,14,w-28,h-28);ctx.setLineDash([]);
    ctx.fillStyle='#00E5FF';ctx.shadowColor='#00E5FF';ctx.shadowBlur=10;
    const cs=22;
    [[0,0,1,1],[w,0,-1,1],[0,h,1,-1],[w,h,-1,-1]].forEach(([ox,oy,sx,sy])=>{
      ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+sx*cs,oy);ctx.lineTo(ox,oy+sy*cs);ctx.closePath();ctx.fill();
    });
  }
  ctx.restore();
}

async function startStream(){
  const v=document.getElementById('videoEl');
  if(!v) return;
  if(ST.stream) return; // すでに起動中
  try{
    const s=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user',width:{ideal:1280},height:{ideal:960}},
      audio:false
    });
    ST.stream=s;
    v.srcObject=s;
    v.addEventListener('loadedmetadata',()=>applyVideoZoom(),{once:true});
  }catch(e){
    const cw=document.getElementById('camWrap');
    if(cw) cw.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:10px;color:rgba(255,255,255,.5);font-size:.8rem;padding:16px;text-align:center">カメラへのアクセスが必要です。<br>ブラウザの設定でカメラを許可してください。<br><small style="opacity:.5">${e.message}</small></div>`;
  }
}

function stopStream(){
  if(!ST.stream) return;
  ST.stream.getTracks().forEach(t=>t.stop());
  ST.stream=null;
  const v=document.getElementById('videoEl');
  if(v) v.srcObject=null;
}

}

// ─────────────────────────────────
// 盛れる処理（肌を白く・きれいに）
// ─────────────────────────────────
function applyMoru(srcCanvas){
  const W=srcCanvas.width, H=srcCanvas.height;
  const out=document.createElement('canvas');
  out.width=W; out.height=H;
  const ctx=out.getContext('2d');
  ctx.drawImage(srcCanvas,0,0);

  const imgData=ctx.getImageData(0,0,W,H);
  const d=imgData.data;

  for(let i=0;i<d.length;i+=4){
    const r=d[i], g=d[i+1], b=d[i+2];

    // 肌色判定（より厳しく絞る）
    // - R が最大チャンネルであること
    // - R-G, R-B の差が一定範囲内（肌らしい暖かみ）
    // - 極端に暗い／明るいピクセルは除外
    const rg=r-g, rb=r-b;
    const isSkin=(
      r>130 && g>80 && b>60 &&   // 最低輝度
      r<240 &&                    // 飽和ピクセル除外
      r>g && r>b &&               // R が最大
      rg>10 && rg<80 &&           // 赤みが強すぎず弱すぎず
      rb>20 && rb<120 &&          // 青みが抑えられている
      b < 180                     // 青が強い色（空・服など）を除外
    );

    if(isSkin){
      // マイルドに明るく・白く（効果を控えめに）
      const bright=18;
      const sat=0.75; // 1=変化なし → 0=完全に白。0.75=25%だけ白に寄せる
      const nr=Math.min(255, r+bright);
      const ng=Math.min(255, g+bright*0.8);
      const nb=Math.min(255, b+bright*0.6);
      d[i]  =Math.round(nr*sat + 255*(1-sat));
      d[i+1]=Math.round(ng*sat + 255*(1-sat));
      d[i+2]=Math.round(nb*sat + 255*(1-sat));
    }
    // 非肌色はそのまま（余計な明度変更をしない）
  }
  ctx.putImageData(imgData,0,0);

  // 仕上げ：ごく薄い白みを全体にのせる
  ctx.globalCompositeOperation='screen';
  ctx.fillStyle='rgba(255,245,250,0.06)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';

  return out;
}

  }

function capturePhoto(){
  const v=document.getElementById('videoEl');
  const fo=document.getElementById('flashOv');
  const co=document.getElementById('cdOv');
  const cv=document.getElementById('capCv');
  const ctx=cv.getContext('2d');
  cv.width=ST.PW;cv.height=ST.PH;
  // center-crop from video（ズーム反映）
  const vr=v.videoWidth/v.videoHeight;
  const pr=ST.PW/ST.PH;
  let sx=0,sy=0,sw=v.videoWidth,sh=v.videoHeight;
  if(vr>pr){sw=Math.round(sh*pr);sx=(v.videoWidth-sw)/2;}
  else{sh=Math.round(sw/pr);sy=(v.videoHeight-sh)/2;}
  // ズーム：crop領域をz倍縮小して中央を拡大
  const z=ST.zoom;
  const sw2=Math.round(sw/z), sh2=Math.round(sh/z);
  sx=Math.round(sx+(sw-sw2)/2);
  sy=Math.round(sy+(sh-sh2)/2);
  sw=sw2; sh=sh2;
  ctx.save();ctx.translate(ST.PW,0);ctx.scale(-1,1);
  ctx.drawImage(v,sx,sy,sw,sh,0,0,ST.PW,ST.PH);
  ctx.restore();
  // save raw (no frame, no moru) for later re-apply
  ST.rawPhotos[ST.photosTaken]=cv.toDataURL('image/png');
  // 盛れる処理
  if(ST.moru){
    const moruCv=applyMoru(cv);
    ctx.clearRect(0,0,ST.PW,ST.PH);
    ctx.drawImage(moruCv,0,0);
  }
  drawFrame(ctx,ST.PW,ST.PH,ST.frame);
  const url=cv.toDataURL('image/png');
  const idx=ST.photosTaken;
  ST.photos[idx]=url;ST.photosTaken++;
  fo.style.opacity='1';setTimeout(()=>fo.style.opacity='0',120);
  setTimeout(()=>{co.style.opacity='0';co.textContent='';},350);
  updateThumb(idx,url);
  document.getElementById('pctr').textContent=`${ST.photosTaken} / 4 枚 撮影済み`;
  ST.shooting=false;
  const sb=document.getElementById('shootBtn');
  if(ST.photosTaken>=4){
    sb.disabled=true;
    sb.querySelector('span').textContent='4枚撮影完了！';
    document.getElementById('goDecoBtn').disabled=false;
    const csb=document.getElementById('camShutterBtn');
    if(csb) csb.style.opacity='0.3', csb.style.pointerEvents='none';
  }else sb.disabled=false;
}

function reapplyFrameToAllPhotos(){
  // Re-render each captured photo with the new frame onto ST.photos[i]
  // We keep the raw video snapshot separately; here we store base+frame together.
  // Since we bake the frame at capture time, we need to re-bake from rawPhotos.
  const tasks=[];
  for(let i=0;i<4;i++){
    if(!ST.rawPhotos[i])continue;
    tasks.push(new Promise(resolve=>{
      const cv=document.createElement('canvas');
      cv.width=ST.PW;cv.height=ST.PH;
      const ctx=cv.getContext('2d');
      const img=new Image();
      img.onload=()=>{
        ctx.drawImage(img,0,0,ST.PW,ST.PH);
        if(ST.moru){
          const moruCv=applyMoru(cv);
          ctx.clearRect(0,0,ST.PW,ST.PH);
          ctx.drawImage(moruCv,0,0);
        }
        drawFrame(ctx,ST.PW,ST.PH,ST.frame);
        ST.photos[i]=cv.toDataURL('image/png');
        // update thumbnail
        const slot=document.getElementById(`t${i}`);
        if(slot){const ti=slot.querySelector('img');if(ti)ti.src=ST.photos[i];}
        resolve();
      };
      img.src=ST.rawPhotos[i];
    }));
  }
  Promise.all(tasks).then(()=>renderDecoCv());
}

function updateThumb(idx,url){

  el.classList.remove('cur');el.classList.add('done');

  const nx=document.getElementById(`t${idx+1}`);
  if(nx)nx.classList.add('cur');
}

  if(n===3) renderPrint();
}

// ─────────────────────────────────
// DECO CANVAS
// ─────────────────────────────────
function setupDecoCanvas(){
  const wrap=document.getElementById('decoCvWrap');
  const cv=document.getElementById('decoCanvas');
  const maxW=Math.min(400,window.innerWidth-44);
  const scale=maxW/ST.PW;
  const dispH=Math.round(ST.PH*scale);
  wrap.style.width=maxW+'px';
  wrap.style.height=dispH+'px';
  cv.width=ST.PW;cv.height=ST.PH;
  cv.style.width=maxW+'px';cv.style.height=dispH+'px';

  // remove old listeners by replacing element
  const newCv=cv.cloneNode(false);
  newCv.id='decoCanvas';newCv.width=ST.PW;newCv.height=ST.PH;
  newCv.style.width=maxW+'px';newCv.style.height=dispH+'px';
  wrap.replaceChild(newCv,cv);

  newCv.addEventListener('mousedown',e=>onDS(e,false));
  newCv.addEventListener('touchstart',e=>onDS(e,true),{passive:false});
  document.addEventListener('mousemove',onDM);
  document.addEventListener('mouseup',onDE);
  document.addEventListener('touchmove',e=>{if(ST.dragging)e.preventDefault();onDM(e);},{passive:false});
  document.addEventListener('touchend',onDE);
}

function cvPos(e,isTouch){
  const cv=document.getElementById('decoCanvas');
  const rect=cv.getBoundingClientRect();
  const scaleX=ST.PW/rect.width,scaleY=ST.PH/rect.height;
  const cx=isTouch?e.touches[0].clientX:e.clientX;
  const cy=isTouch?e.touches[0].clientY:e.clientY;
  return{x:(cx-rect.left)*scaleX,y:(cy-rect.top)*scaleY};
}

function onDS(e,isTouch){
  const pos=cvPos(e,isTouch);
  const items=ST.decoData[ST.curPhoto];
  // hit test top-most
  for(let i=items.length-1;i>=0;i--){
    const item=items[i];
    if(hitTest(item,pos)){
      if(isTouch)e.preventDefault();
      ST.selItem={photoIdx:ST.curPhoto,itemIdx:i};
      ST.dragging={photoIdx:ST.curPhoto,itemIdx:i};
      ST.dragOffX=pos.x-item.x;
      ST.dragOffY=pos.y-item.y;
      showSelLabel(item);
      renderDecoCv();
      return;
    }
  }
  // deselect
  ST.selItem=null;
  document.getElementById('selItemLabel').textContent='';
  renderDecoCv();
}

function hitTest(item,pos){
  if(item.type==='text'){
    const w=item.size*item.text.length*0.62;
    const h=item.size;
    return(pos.x>=item.x&&pos.x<=item.x+w&&pos.y>=item.y-h&&pos.y<=item.y+6);
  } else if(item.type==='stamp'){
    return(pos.x>=item.x&&pos.x<=item.x+item.w&&pos.y>=item.y&&pos.y<=item.y+item.h);
  }
  return false;
}

function showSelLabel(item){
  const label=item.type==='text'?`"${item.text}"`:STAMPS[item.svgIdx].name;
  document.getElementById('selItemLabel').textContent=`選択中: ${label}（ドラッグで移動）`;
}

function onDM(e){
  if(!ST.dragging)return;
  const{photoIdx,itemIdx}=ST.dragging;
  const cv=document.getElementById('decoCanvas');if(!cv)return;
  const isTouch=e.type.startsWith('touch');
  const pos=cvPos(e,isTouch);
  const item=ST.decoData[photoIdx][itemIdx];
  item.x=Math.max(0,Math.min(ST.PW-10,pos.x-ST.dragOffX));
  item.y=Math.max(10,Math.min(ST.PH,pos.y-ST.dragOffY));
  renderDecoCv();
}

function onDE(){ST.dragging=null;}


// rawPhoto に decoMoru を適用した画像URLを返す（Promise）
function getMoruPhotoUrl(idx){
  return new Promise(resolve=>{
    const src=ST.rawPhotos[idx];
    if(!src){resolve(null);return;}
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas');
      cv.width=ST.PW;cv.height=ST.PH;
      const ctx=cv.getContext('2d');
      ctx.drawImage(img,0,0,ST.PW,ST.PH);
      if(ST.decoMoru){
        const moruCv=applyMoru(cv);
        ctx.clearRect(0,0,ST.PW,ST.PH);
        ctx.drawImage(moruCv,0,0);
      }
      drawFrame(ctx,ST.PW,ST.PH,ST.frame);
      resolve(cv.toDataURL('image/png'));
    };
    img.src=src;
  });
}

function renderDecoByIdx(idx){
  // 指定indexのcanvasを再描画（decoMoru反映）
  // curPhotoのときだけ#decoCanvasに描く
  if(idx!==ST.curPhoto) return;
  renderDecoCv();
}

function renderDecoCv(){
  const cv=document.getElementById('decoCanvas');if(!cv)return;
  const ctx=cv.getContext('2d');
  const idx=ST.curPhoto;
  ctx.clearRect(0,0,ST.PW,ST.PH);
  ctx.fillStyle=ST.bgColors[idx]||'#000';
  ctx.fillRect(0,0,ST.PW,ST.PH);

  const drawDecos=()=>{
    ST.decoData[idx].forEach((item,i)=>{
      ctx.save();
      const isSel=ST.selItem&&ST.selItem.photoIdx===idx&&ST.selItem.itemIdx===i;
      if(item.type==='text'){
        ctx.font=`bold ${item.size}px ${item.font}`;
        ctx.fillStyle=item.color;
        ctx.strokeStyle='rgba(0,0,0,.55)';
        ctx.lineWidth=item.size*.12;
        ctx.lineJoin='round';
        ctx.strokeText(item.text,item.x,item.y);
        ctx.fillText(item.text,item.x,item.y);
        if(isSel){
          const tw=ctx.measureText(item.text).width;
          ctx.strokeStyle=var_cy;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
          ctx.strokeRect(item.x-2,item.y-item.size-2,tw+4,item.size+6);
          ctx.setLineDash([]);
        }
      } else if(item.type==='stamp'){
        if(item.imgEl&&item.imgEl.complete&&item.imgEl.naturalWidth>0){
          ctx.drawImage(item.imgEl,item.x,item.y,item.w,item.h);
        }
        if(isSel){
          ctx.strokeStyle=var_cy;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
          ctx.strokeRect(item.x-2,item.y-2,item.w+4,item.h+4);
          ctx.setLineDash([]);
        }
      }
      ctx.restore();
    });
  };

  // rawPhotos から decoMoru 適用済み画像を使う
  if(ST.rawPhotos[idx]){
    getMoruPhotoUrl(idx).then(url=>{
      if(!url){drawDecos();return;}
      const img=new Image();
      img.onload=()=>{ctx.drawImage(img,0,0,ST.PW,ST.PH);drawDecos();};
      img.src=url;
    });
  } else drawDecos();
}
const var_cy='#00E5FF';

function addText(){
  const t=document.getElementById('txtIn').value.trim();if(!t)return;
  const idx=ST.curPhoto;
  const item={type:'text',text:t,
    x:Math.random()*(ST.PW-t.length*ST.fontSize*.5-20)+10,
    y:Math.random()*(ST.PH-ST.fontSize-20)+ST.fontSize+10,
    color:ST.textColor,size:ST.fontSize,font:ST.fontVal};
  ST.decoData[idx].push(item);
  ST.selItem={photoIdx:idx,itemIdx:ST.decoData[idx].length-1};
  showSelLabel(item);
  renderDecoCv();
  document.getElementById('txtIn').value='';
}

function addStamp(svgIdx){
  const idx=ST.curPhoto;
  const sz=Math.floor(Math.min(ST.PW,ST.PH)*.18);
  const item={type:'stamp',svgIdx,
    x:Math.random()*(ST.PW-sz),y:Math.random()*(ST.PH-sz),
    w:sz,h:sz,imgEl:null};
  const blob=new Blob([STAMPS[svgIdx].svg],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{item.imgEl=img;renderDecoCv();};
  img.src=url;item.imgEl=img;
  ST.decoData[idx].push(item);
  ST.selItem={photoIdx:idx,itemIdx:ST.decoData[idx].length-1};
  showSelLabel(item);
}

function clearCurrent(){ST.decoData[ST.curPhoto]=[];ST.selItem=null;document.getElementById('selItemLabel').textContent='';renderDecoCv();}
function undoLast(){const d=ST.decoData[ST.curPhoto];if(d.length>0){d.pop();ST.selItem=null;document.getElementById('selItemLabel').textContent='';renderDecoCv();}}
function deleteSelectedItem(){
  if(!ST.selItem)return;
  const{photoIdx,itemIdx}=ST.selItem;
  if(photoIdx===ST.curPhoto){ST.decoData[photoIdx].splice(itemIdx,1);ST.selItem=null;document.getElementById('selItemLabel').textContent='';renderDecoCv();}
}

// ─────────────────────────────────
// PRINT
// ─────────────────────────────────
function getDecoSnapshot(idx){
  return new Promise(resolve=>{
    const cv=document.createElement('canvas');
    cv.width=ST.PW;cv.height=ST.PH;
    const ctx=cv.getContext('2d');
    ctx.fillStyle=ST.bgColors[idx]||'#000';
    ctx.fillRect(0,0,ST.PW,ST.PH);
    const drawDecos=()=>{
      ST.decoData[idx].forEach(item=>{
        ctx.save();
        if(item.type==='text'){
          ctx.font=`bold ${item.size}px ${item.font}`;
          ctx.fillStyle=item.color;
          ctx.strokeStyle='rgba(0,0,0,.55)';
          ctx.lineWidth=item.size*.12;ctx.lineJoin='round';
          ctx.strokeText(item.text,item.x,item.y);
          ctx.fillText(item.text,item.x,item.y);
        } else if(item.type==='stamp'&&item.imgEl&&item.imgEl.complete){
          ctx.drawImage(item.imgEl,item.x,item.y,item.w,item.h);
        }
        ctx.restore();
      });
      resolve(cv);
    };
    // rawPhotos + decoMoru を使って描画
    getMoruPhotoUrl(idx).then(url=>{
      const src=url||ST.photos[idx];
      if(src){
        const img=new Image();
        img.onload=()=>{ctx.drawImage(img,0,0,ST.PW,ST.PH);drawDecos();};
        img.src=src;
      } else drawDecos();
    });
  });
}

async function renderPrint(){
  const snapshots=await Promise.all([0,1,2,3].map(i=>getDecoSnapshot(i)));

  // Layout: 2x2 grid strip
  const CW=Math.floor(ST.PW*.5), CH=Math.floor(ST.PH*.5);
  const PAD=12;
  const BORDER=3;
  const SW=CW*2+PAD*3;
  const SH=CH*2+PAD*4+32;

  const cv=document.getElementById('printCanvas');
  cv.width=SW;cv.height=SH;
  const ctx=cv.getContext('2d');

  // background
  const bg=ctx.createLinearGradient(0,0,SW,SH);
  bg.addColorStop(0,'#1A0033');bg.addColorStop(.5,'#0A0018');bg.addColorStop(1,'#1A0033');
  ctx.fillStyle=bg;
  if(ctx.roundRect)ctx.roundRect(0,0,SW,SH,12);else ctx.rect(0,0,SW,SH);
  ctx.fill();

  // shimmer edge
  const sh=ctx.createLinearGradient(0,0,SW,0);
  sh.addColorStop(0,'transparent');sh.addColorStop(.5,'#FF3D9A');sh.addColorStop(1,'transparent');
  ctx.fillStyle=sh;ctx.fillRect(0,0,SW,2);ctx.fillRect(0,SH-2,SW,2);

  const positions=[[PAD,PAD],[PAD*2+CW,PAD],[PAD,PAD*2+CH],[PAD*2+CW,PAD*2+CH]];
  for(let i=0;i<4;i++){
    const[x,y]=positions[i];
    ctx.fillStyle='rgba(255,255,255,.88)';
    ctx.fillRect(x-BORDER,y-BORDER,CW+BORDER*2,CH+BORDER*2);
    ctx.drawImage(snapshots[i],x,y,CW,CH);
  }

  // bottom text
  ctx.font=`bold 10px 'Reggae One',sans-serif`;
  ctx.fillStyle='#FF3D9A';ctx.textAlign='center';
  ctx.shadowColor='#FF3D9A';ctx.shadowBlur=6;
  ctx.fillText('プリクラ初号機',SW/2,SH-PAD-10);
  ctx.shadowBlur=0;
  ctx.font=`7px 'DotGothic16',monospace`;
  ctx.fillStyle='rgba(255,255,255,.3)';
  const d=new Date();
  ctx.fillText(`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`,SW/2,SH-PAD+2);
}

// ─────────────────────────────────
// DOWNLOAD (iOS対応)
// ─────────────────────────────────
async function handleDownload(){
  await renderPrint();
  const cv=document.getElementById('printCanvas');
  const dataUrl=cv.toDataURL('image/png');
  if(ST.isIOS){
    // iOS: show image for long-press save
    document.getElementById('saveImg').src=dataUrl;
    document.getElementById('saveImgWrap').style.display='flex';
    document.getElementById('iosTip').style.display='block';
  } else {
    const a=document.createElement('a');
    a.download=`purikura_${Date.now()}.png`;
    a.href=dataUrl;a.click();
  }
}

// ─────────────────────────────────
// UI INIT
// ─────────────────────────────────
function initSwatches(){
  const c=document.getElementById('swatches');
  COLORS.forEach(col=>{
    const sw=document.createElement('div');
    sw.className='sw'+(col===ST.textColor?' sel':'');
    sw.style.background=col;
    sw.style.outline=`1.5px solid ${col==='#ffffff'?'#aaa':col}`;
    sw.addEventListener('click',()=>{
      ST.textColor=col;
      document.querySelectorAll('.sw').forEach(s=>s.classList.remove('sel'));
      sw.classList.add('sel');
    });
    c.appendChild(sw);
  });
}

function initFontSel(){
  const c=document.getElementById('fontSel');
  FONTS.forEach((f,i)=>{
    const btn=document.createElement('button');
    btn.className='font-btn'+(i===0?' sel':'');
    btn.textContent=f.label;
    btn.style.fontFamily=f.value;
    btn.addEventListener('click',()=>{
      ST.fontVal=f.value;
      document.querySelectorAll('.font-btn').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
    });
    c.appendChild(btn);
  });
}

function initStamps(){
  const g=document.getElementById('stampGrid');
  STAMPS.forEach((s,i)=>{
    const btn=document.createElement('div');
    btn.className='ostamp';btn.title=s.name;
    btn.innerHTML=s.svg;
    btn.addEventListener('click',()=>addStamp(i));
    g.appendChild(btn);
  });
}

function initBgPicker(){
  const g=document.getElementById('bgPicker');
  BG_PRESETS.forEach((col,idx)=>{
    const d=document.createElement('div');
    d.className='bgcol'+(idx===0?' sel':'');
    d.style.background=col;
    d.style.outline=`1px solid ${col==='#ffffff'?'#aaa':'rgba(255,255,255,.2)'}`;
    d.addEventListener('click',()=>{
      ST.bgColors[ST.curPhoto]=col;
      document.querySelectorAll('.bgcol').forEach(b=>b.classList.remove('sel'));
      d.classList.add('sel');
      renderDecoCv();
    });
    g.appendChild(d);
  });
  const cw=document.createElement('div');
  cw.className='bgcol-custom';cw.title='カスタム色';
  const inp=document.createElement('input');inp.type='color';inp.value='#ff3d9a';
  inp.addEventListener('input',()=>{ST.bgColors[ST.curPhoto]=inp.value;renderDecoCv();});
  cw.appendChild(inp);g.appendChild(cw);
}

document.addEventListener('DOMContentLoaded',()=>{
  initSwatches();
  initFontSel();
  initStamps();
  initBgPicker();

  document.getElementById('sizeGrid').addEventListener('click',e=>{
    const card=e.target.closest('.size-card');if(!card)return;
    document.querySelectorAll('.size-card').forEach(c=>c.classList.remove('sel'));
    card.classList.add('sel');
    ST.PW=parseInt(card.dataset.w);
    ST.PH=parseInt(card.dataset.h);
  });

  document.getElementById('framePicker').addEventListener('click',e=>{
    const b=e.target.closest('.fbtn');if(!b)return;
    document.querySelectorAll('#framePicker .fbtn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');ST.frame=b.dataset.frame;
    syncDecoFramePicker();
  });

  document.getElementById('fsz').addEventListener('input',e=>{
    ST.fontSize=parseInt(e.target.value);
    document.getElementById('fszL').textContent=ST.fontSize;
  });
});
</script>
