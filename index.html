<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>★ PURIKURA STUDIO ★</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=DotGothic16&family=Yuji+Syuku&family=Reggae+One&family=Hachi+Maru+Pop&family=RocknRoll+One&display=swap" rel="stylesheet">
<style>
:root {
  --pk: #FF3D9A;
  --cy: #00E5FF;
  --yw: #FFE135;
  --pu: #B14AED;
  --gn: #39FF14;
  --og: #FF6B1A;
  --bg: #0A0018;
  --dk: #1A0033;
  --card: rgba(255,255,255,0.04);
  --border: rgba(255,61,154,0.25);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  background:var(--bg);
  font-family:'Zen Maru Gothic',sans-serif;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}

/* Animated BG */
body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% 30%, rgba(177,74,237,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 80% 70%, rgba(255,61,154,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 10%, rgba(0,229,255,0.08) 0%, transparent 50%);
  pointer-events:none;z-index:0;
  animation:bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse{
  0%{opacity:0.7;}100%{opacity:1;}
}

/* Scanlines */
body::after{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.06) 3px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:999;
}

.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:8px 10px 30px;}

/* ===== HEADER ===== */
.hdr{text-align:center;padding:12px 0 6px;position:relative;}
.hdr-logo{
  font-family:'Reggae One',sans-serif;
  font-size:2.6rem;
  letter-spacing:6px;
  background:linear-gradient(90deg,var(--pk),var(--yw),var(--cy),var(--pu),var(--pk));
  background-size:300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:logoShimmer 4s linear infinite;
  filter:drop-shadow(0 0 12px rgba(255,61,154,0.6));
}
@keyframes logoShimmer{0%{background-position:0%}100%{background-position:300%}}
.hdr-sub{font-family:'DotGothic16',monospace;font-size:0.6rem;color:var(--cy);letter-spacing:5px;margin-top:3px;opacity:0.8;}

.deco-bar{height:2px;background:linear-gradient(90deg,transparent,var(--pk),var(--cy),var(--yw),transparent);margin:8px 0;border-radius:2px;animation:logoShimmer 3s linear infinite;background-size:300%;}

/* ===== STEP NAV ===== */
.steps{display:flex;justify-content:center;align-items:center;gap:0;margin:6px 0;}
.step{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:default;}
.step-circle{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:0.65rem;font-weight:900;color:rgba(255,255,255,0.3);transition:all .3s;}
.step-label{font-size:0.55rem;color:rgba(255,255,255,0.3);letter-spacing:1px;transition:all .3s;}
.step.active .step-circle{background:var(--yw);border-color:var(--yw);color:var(--bg);box-shadow:0 0 12px var(--yw);}
.step.active .step-label{color:var(--yw);}
.step.done .step-circle{background:var(--gn);border-color:var(--gn);color:var(--bg);}
.step.done .step-label{color:var(--gn);}
.step-line{width:40px;height:2px;background:rgba(255,255,255,0.1);margin-bottom:14px;}

/* ===== PANELS ===== */
.panel{display:none;animation:slideIn .35s ease;}
.panel.active{display:block;}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ===== CARD ===== */
.card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;backdrop-filter:blur(12px);}
.card.cyan-border{border-color:rgba(0,229,255,0.25);}
.card.yellow-border{border-color:rgba(255,225,53,0.25);}

/* ===== SECTION LABEL ===== */
.slabel{font-family:'DotGothic16',monospace;font-size:0.62rem;color:var(--cy);letter-spacing:3px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.slabel::before{content:'◆';color:var(--pk);font-size:0.5rem;}

/* ===== FRAME PICKER ===== */
.frame-picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.fbtn{padding:5px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.7);font-size:0.68rem;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;transition:all .2s;font-weight:700;}
.fbtn:hover{border-color:var(--pk);color:var(--pk);}
.fbtn.sel{background:var(--pk);border-color:var(--pk);color:#fff;box-shadow:0 0 10px rgba(255,61,154,0.5);}

/* ===== CAMERA ===== */
.cam-wrap{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;border:2px solid var(--pk);box-shadow:0 0 20px rgba(255,61,154,0.35),inset 0 0 30px rgba(0,0,0,0.6);max-height:320px;}
#videoEl{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
.cam-corners .corner{position:absolute;width:20px;height:20px;border-color:var(--cy);border-style:solid;opacity:.9;}
.corner.tl{top:7px;left:7px;border-width:2.5px 0 0 2.5px;}
.corner.tr{top:7px;right:7px;border-width:2.5px 2.5px 0 0;}
.corner.bl{bottom:7px;left:7px;border-width:0 0 2.5px 2.5px;}
.corner.br{bottom:7px;right:7px;border-width:0 2.5px 2.5px 0;}
.countdown-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);font-family:'Reggae One',sans-serif;font-size:7rem;color:var(--yw);text-shadow:0 0 40px var(--yw),0 0 80px var(--og);pointer-events:none;opacity:0;z-index:10;transition:opacity .15s;}
.flash-ov{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:20;transition:opacity .08s;}

/* Thumbs */
.thumbs{display:flex;gap:5px;margin-top:8px;justify-content:center;}
.tslot{width:72px;height:54px;border-radius:6px;border:2px dashed rgba(255,255,255,0.15);background:rgba(0,0,0,0.3);overflow:hidden;position:relative;flex-shrink:0;}
.tslot img{width:100%;height:100%;object-fit:cover;}
.tslot .tnum{position:absolute;top:2px;left:3px;font-size:0.5rem;color:rgba(255,255,255,0.5);font-family:'DotGothic16',monospace;}
.tslot.done{border-color:var(--gn);border-style:solid;}
.tslot.cur{border-color:var(--yw);border-style:solid;animation:pulseY .9s ease infinite;}
@keyframes pulseY{0%,100%{box-shadow:0 0 4px var(--yw);}50%{box-shadow:0 0 14px var(--yw);}}

/* Shoot btn */
.shoot-btn{width:100%;padding:13px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--pk),var(--pu));color:#fff;font-size:0.95rem;font-weight:900;font-family:'Reggae One',sans-serif;cursor:pointer;letter-spacing:4px;box-shadow:0 0 18px rgba(255,61,154,0.5);transition:all .2s;position:relative;overflow:hidden;}
.shoot-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--pu),var(--pk));opacity:0;transition:opacity .2s;}
.shoot-btn:hover::after{opacity:1;}
.shoot-btn:active{transform:scale(.97);}
.shoot-btn:disabled{opacity:.45;cursor:not-allowed;}
.shoot-btn span{position:relative;z-index:1;}
.pcounter{text-align:center;font-family:'DotGothic16',monospace;font-size:0.65rem;color:rgba(255,255,255,0.5);margin-top:5px;letter-spacing:2px;}

/* ===== NAV BTNS ===== */
.nav-row{display:flex;gap:8px;margin-top:10px;}
.nbtn{flex:1;padding:9px;border-radius:30px;border:1.5px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.04);color:#fff;font-size:0.75rem;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;font-weight:700;letter-spacing:1px;transition:all .2s;}
.nbtn:hover{border-color:var(--pk);}
.nbtn.next{background:linear-gradient(135deg,var(--pk),var(--pu));border-color:transparent;box-shadow:0 0 14px rgba(255,61,154,0.45);}
.nbtn.next:hover{box-shadow:0 0 24px rgba(255,61,154,0.7);}
.nbtn:disabled{opacity:.35;cursor:not-allowed;}

/* ===== DECO PANEL ===== */
.deco-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.dpwrap{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .2s;aspect-ratio:4/3;}
.dpwrap:hover{border-color:rgba(0,229,255,0.5);}
.dpwrap.sel{border-color:var(--yw);box-shadow:0 0 10px rgba(255,225,53,0.5);}
.dpwrap canvas{width:100%;height:100%;display:block;}
.dphint{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:0.5rem;color:rgba(255,255,255,0.6);background:rgba(0,0,0,0.55);padding:2px;font-family:'DotGothic16',monospace;}

.sel-label{font-family:'DotGothic16',monospace;font-size:0.6rem;color:var(--yw);text-align:center;margin-bottom:8px;letter-spacing:2px;}

/* Deco tools */
.tool-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.ti{flex:1;min-width:100px;padding:7px 11px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.18);background:rgba(255,255,255,0.06);color:#fff;font-family:'Zen Maru Gothic',sans-serif;font-size:0.82rem;outline:none;transition:border-color .2s;}
.ti:focus{border-color:var(--cy);}
.ta-btn{padding:7px 16px;border-radius:20px;border:none;background:linear-gradient(135deg,var(--cy),var(--pu));color:#fff;font-size:0.75rem;font-weight:bold;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;box-shadow:0 0 10px rgba(0,229,255,0.35);transition:all .2s;}
.ta-btn:hover{transform:scale(1.05);}
.clr-btn{padding:7px 12px;border-radius:20px;border:1.5px solid rgba(255,255,255,0.18);background:transparent;color:rgba(255,255,255,0.55);font-size:0.7rem;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;transition:all .2s;}
.clr-btn:hover{border-color:var(--og);color:var(--og);}

/* Color swatches */
.swatches{display:flex;gap:4px;flex-wrap:wrap;}
.sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;flex-shrink:0;}
.sw:hover,.sw.sel{border-color:#fff;transform:scale(1.25);box-shadow:0 0 6px currentColor;}

/* Font selector */
.font-sel-wrap{display:flex;gap:5px;flex-wrap:wrap;}
.font-btn{padding:4px 10px;border-radius:14px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.7);font-size:0.72rem;cursor:pointer;transition:all .2s;}
.font-btn:hover{border-color:var(--cy);}
.font-btn.sel{background:var(--cy);border-color:var(--cy);color:var(--bg);}

/* Font size */
.fslider{-webkit-appearance:none;width:90px;height:4px;border-radius:2px;background:rgba(255,255,255,0.18);outline:none;}
.fslider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--pk);cursor:pointer;box-shadow:0 0 5px var(--pk);}

/* BG color picker */
.bg-picker{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.bgcol{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s;flex-shrink:0;}
.bgcol:hover,.bgcol.sel{border-color:#fff;transform:scale(1.2);box-shadow:0 0 8px rgba(255,255,255,0.4);}
.bgcol.custom-wrap{position:relative;overflow:hidden;}
.bgcol.custom-wrap input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}

/* ===== ORIGINAL STAMPS ===== */
.stamp-grid{display:flex;gap:5px;flex-wrap:wrap;}
.ostamp{width:46px;height:46px;border-radius:8px;cursor:pointer;border:1.5px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.ostamp:hover{border-color:var(--pk);transform:scale(1.12);box-shadow:0 0 8px rgba(255,61,154,0.4);}
.ostamp svg{width:32px;height:32px;pointer-events:none;}

/* ===== DRAG HINT ===== */
.drag-hint{font-family:'DotGothic16',monospace;font-size:0.55rem;color:rgba(0,229,255,0.6);text-align:center;margin-bottom:4px;letter-spacing:1px;}

/* ===== PRINT PANEL ===== */
.print-wrap{display:flex;justify-content:center;margin-bottom:14px;}
#printCanvas{border-radius:10px;box-shadow:0 0 30px rgba(255,61,154,0.5),0 0 60px rgba(0,229,255,0.2),0 8px 32px rgba(0,0,0,0.5);max-width:100%;height:auto;}
.act-btns{display:flex;gap:8px;flex-wrap:wrap;}
.abtn-p{flex:1;min-width:130px;padding:12px;border-radius:50px;border:none;background:linear-gradient(135deg,var(--yw),var(--og));color:var(--bg);font-size:0.85rem;font-weight:900;font-family:'Reggae One',sans-serif;cursor:pointer;letter-spacing:3px;box-shadow:0 0 18px rgba(255,225,53,0.5);transition:all .2s;}
.abtn-p:hover{transform:scale(1.03);box-shadow:0 0 28px rgba(255,225,53,0.7);}
.abtn-s{flex:1;min-width:130px;padding:12px;border-radius:50px;border:1.5px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.05);color:#fff;font-size:0.8rem;font-weight:700;font-family:'Zen Maru Gothic',sans-serif;cursor:pointer;letter-spacing:2px;transition:all .2s;}
.abtn-s:hover{border-color:var(--pk);color:var(--pk);}

.star-deco{text-align:center;font-family:'DotGothic16',monospace;font-size:0.7rem;color:var(--yw);letter-spacing:4px;opacity:.65;margin:8px 0;}
</style>
</head>
<body>
<div class="wrap">

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-logo">★ PURIKURA ★</div>
  <div class="hdr-sub">プリクラ Web Studio v2.0</div>
</div>
<div class="deco-bar"></div>

<!-- STEPS -->
<div class="steps">
  <div class="step active" id="s1"><div class="step-circle">1</div><div class="step-label">撮影</div></div>
  <div class="step-line"></div>
  <div class="step" id="s2"><div class="step-circle">2</div><div class="step-label">デコる</div></div>
  <div class="step-line"></div>
  <div class="step" id="s3"><div class="step-circle">3</div><div class="step-label">プリント</div></div>
</div>
<div class="deco-bar"></div>

<!-- ===== PANEL 1 ===== -->
<div class="panel active" id="p1">
  <div class="card">
    <div class="slabel">フレームを選ぼう</div>
    <div class="frame-picker" id="framePicker">
      <button class="fbtn sel" data-frame="heart">💗 ハート</button>
      <button class="fbtn" data-frame="star">⭐ スター</button>
      <button class="fbtn" data-frame="flower">🌸 フラワー</button>
      <button class="fbtn" data-frame="rainbow">🌈 レインボー</button>
      <button class="fbtn" data-frame="cyber">💜 サイバー</button>
      <button class="fbtn" data-frame="none">□ なし</button>
    </div>

    <div class="cam-wrap" id="camWrap">
      <video id="videoEl" autoplay playsinline muted></video>
      <div class="cam-corners">
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
      </div>
      <div class="countdown-ov" id="cdOv"></div>
      <div class="flash-ov" id="flashOv"></div>
    </div>

    <div class="thumbs" id="thumbRow">
      <div class="tslot cur" id="t0"><span class="tnum">1</span></div>
      <div class="tslot" id="t1"><span class="tnum">2</span></div>
      <div class="tslot" id="t2"><span class="tnum">3</span></div>
      <div class="tslot" id="t3"><span class="tnum">4</span></div>
    </div>
  </div>

  <button class="shoot-btn" id="shootBtn" onclick="startCD()"><span>📸 シャッター！（3秒後に撮影）</span></button>
  <div class="pcounter" id="pctr">0 / 4 枚 撮影済み</div>
  <div class="nav-row"><button class="nbtn next" id="goDecoBtn" onclick="goPanel(2)" disabled>デコる ▶</button></div>
</div>

<!-- ===== PANEL 2 ===== -->
<div class="panel" id="p2">
  <div class="card cyan-border">
    <div class="slabel">写真を選んでデコろう</div>
    <div class="sel-label" id="selLabel">▼ 写真をタップして選択 ▼</div>
    <div class="deco-grid" id="decoGrid"></div>
    <div class="drag-hint">💡 デコ項目はドラッグで移動できます</div>
  </div>

  <div class="card cyan-border">
    <div class="slabel">テキスト追加</div>
    <div class="tool-row">
      <input class="ti" type="text" id="txtIn" placeholder="文字を入力...✏️" maxlength="20">
      <button class="ta-btn" onclick="addText()">追加 ✨</button>
    </div>
    <div class="tool-row">
      <span style="font-size:.65rem;color:rgba(255,255,255,.45);flex-shrink:0">色：</span>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="tool-row">
      <span style="font-size:.65rem;color:rgba(255,255,255,.45);flex-shrink:0">サイズ：</span>
      <input type="range" class="fslider" id="fsz" min="12" max="64" value="28">
      <span style="font-size:.65rem;color:var(--pk)" id="fszL">28</span>
    </div>
    <div class="tool-row">
      <span style="font-size:.65rem;color:rgba(255,255,255,.45);flex-shrink:0">フォント：</span>
      <div class="font-sel-wrap" id="fontSel"></div>
    </div>
  </div>

  <div class="card cyan-border">
    <div class="slabel">オリジナルスタンプ</div>
    <div class="stamp-grid" id="stampGrid"></div>
  </div>

  <div class="card cyan-border">
    <div class="slabel">背景色</div>
    <div class="bg-picker" id="bgPicker"></div>
  </div>

  <div class="tool-row" style="margin-top:2px">
    <button class="clr-btn" onclick="clearSel()">この写真をリセット</button>
    <button class="clr-btn" onclick="undoLast()">↩ 元に戻す</button>
  </div>

  <div class="nav-row">
    <button class="nbtn" onclick="goPanel(1)">◀ 撮り直す</button>
    <button class="nbtn next" onclick="goPanel(3)">プリントへ ▶</button>
  </div>
</div>

<!-- ===== PANEL 3 ===== -->
<div class="panel" id="p3">
  <div class="card yellow-border">
    <div class="slabel">プリクラ 完成！</div>
    <div class="star-deco">★ ☆ ★ ☆ ★ ☆ ★ ☆ ★</div>
    <div class="print-wrap"><canvas id="printCanvas"></canvas></div>
    <div class="act-btns">
      <button class="abtn-p" onclick="download()">💾 ダウンロード</button>
      <button class="abtn-s" onclick="goPanel(2)">◀ もっとデコる</button>
    </div>
  </div>
</div>

<div class="star-deco">★ ☆ ★ ☆ ★ ☆ ★ ☆ ★ ☆ ★</div>
</div>

<canvas id="capCv" style="display:none"></canvas>

<script>
// ─────────────────────────────────────────
//  CONSTANTS
// ─────────────────────────────────────────
const PW = 480, PH = 360;

const COLORS = ['#FF3D9A','#FFE135','#00E5FF','#B14AED','#39FF14','#FF6B1A','#ffffff','#ff4444','#44aaff','#000000'];

const FONTS = [
  {label:'丸ゴシック', value:"'Zen Maru Gothic',sans-serif"},
  {label:'ドット',     value:"'DotGothic16',monospace"},
  {label:'筆文字',     value:"'Yuji Syuku',serif"},
  {label:'レゲエ',     value:"'Reggae One',sans-serif"},
  {label:'ポップ',     value:"'Hachi Maru Pop',sans-serif"},
  {label:'ロック',     value:"'RocknRoll One',sans-serif"},
];

const BG_PRESETS = [
  '#000000','#1A0033','#0D0826','#001a0d','#1a0a00',
  '#3d0030','#00101a','#ffffff','#ffe5f0','#e5f0ff',
];

// ─────────────────────────────────────────
//  ORIGINAL SVG STAMPS  (10種)
// ─────────────────────────────────────────
const STAMPS = [
  // 1. 虹ハート
  {name:'虹ハート', svg:`<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="rh" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF3D9A"/><stop offset="50%" stop-color="#FFE135"/><stop offset="100%" stop-color="#00E5FF"/></linearGradient></defs>
    <path d="M32 54 C32 54 8 38 8 22 C8 14 14 8 22 8 C26 8 30 10 32 14 C34 10 38 8 42 8 C50 8 56 14 56 22 C56 38 32 54 32 54Z" fill="url(#rh)" stroke="white" stroke-width="1.5"/>
    <path d="M20 22 C20 18 23 15 27 16" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  </svg>`},

// ─────────────────────────────────────────
//  FRAME DRAW
// ─────────────────────────────────────────
function drawFrame(ctx,w,h,fr){
  if(fr==='none') return;
  ctx.save();
  if(fr==='heart'){
    ctx.strokeStyle='#FF3D9A'; ctx.lineWidth=14;
    ctx.shadowColor='#FF3D9A'; ctx.shadowBlur=10;
    ctx.strokeRect(7,7,w-14,h-14);
    ctx.shadowBlur=0;
    const fs=Math.floor(w*.07);
    ctx.font=`${fs}px serif`;
    [[10,10],[w-22,10],[10,h-22],[w-22,h-22],[w/2-8,6],[w/2-8,h-20]].forEach(([x,y])=>ctx.fillText('💗',x,y+14));
  } else if(fr==='star'){
    ctx.strokeStyle='#FFE135'; ctx.lineWidth=12;
    ctx.shadowColor='#FFE135'; ctx.shadowBlur=14;
    ctx.strokeRect(6,6,w-12,h-12);
    ctx.shadowBlur=0;
    ctx.font=`${Math.floor(w*.065)}px serif`;
    [[8,8],[w/2-8,4],[w-22,8],[4,h/2-8],[w-20,h/2-8],[8,h-22],[w/2-8,h-20],[w-22,h-22]].forEach(([x,y])=>ctx.fillText('⭐',x,y+14));
  } else if(fr==='flower'){
    const g=ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#FF3D9A'); g.addColorStop(.5,'#FFE135'); g.addColorStop(1,'#B14AED');
    ctx.strokeStyle=g; ctx.lineWidth=13;
    ctx.strokeRect(6,6,w-12,h-12);
    ctx.font=`${Math.floor(w*.065)}px serif`;
    [[8,8],[w/3,4],[2*w/3,4],[w-22,8],[4,h/3],[4,2*h/3],[w-20,h/3],[w-20,2*h/3],[8,h-22],[w/3,h-20],[2*w/3,h-20],[w-22,h-22]].forEach(([x,y])=>ctx.fillText('🌸',x,y+14));
  } else if(fr==='rainbow'){
    ['#FF0000','#FF7700','#FFEE00','#00CC00','#0088FF','#8800FF'].forEach((c,i)=>{
      ctx.strokeStyle=c; ctx.lineWidth=3;
      ctx.strokeRect(4+i*3,4+i*3,w-(8+i*6),h-(8+i*6));
    });
    ctx.font=`${Math.floor(w*.08)}px serif`;
    ctx.fillText('🌈',6,h-6); ctx.fillText('🌈',w-30,22);
  } else if(fr==='cyber'){
    ctx.strokeStyle='#00E5FF'; ctx.lineWidth=10;
    ctx.shadowColor='#00E5FF'; ctx.shadowBlur=20;
    ctx.strokeRect(5,5,w-10,h-10);
    ctx.shadowBlur=0;
    ctx.strokeStyle='#B14AED'; ctx.lineWidth=3;
    ctx.setLineDash([8,4]);
    ctx.strokeRect(12,12,w-24,h-24);
    ctx.setLineDash([]);
    ctx.fillStyle='#00E5FF'; ctx.shadowColor='#00E5FF'; ctx.shadowBlur=10;
    [[0,0,1,1],[w,0,-1,1],[0,h,1,-1],[w,h,-1,-1]].forEach(([ox,oy,sx,sy])=>{
      ctx.beginPath(); ctx.moveTo(ox,oy);
      ctx.lineTo(ox+sx*22,oy); ctx.lineTo(ox,oy+sy*22);
      ctx.closePath(); ctx.fill();
    });
  }
  ctx.restore();
}

async function initCam(){
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    ST.stream=s; document.getElementById('videoEl').srcObject=s;
  } catch(e){
    document.getElementById('camWrap').innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:10px;color:rgba(255,255,255,.5);font-size:.8rem;padding:20px;text-align:center"><span style="font-size:2rem">📷</span>カメラへのアクセスが必要です。<br>ブラウザの設定でカメラを許可してください。<br><small style="opacity:.5">${e.message}</small></div>`;
  }
}

document.getElementById('framePicker').addEventListener('click',e=>{
  const b=e.target.closest('.fbtn'); if(!b) return;
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); ST.frame=b.dataset.frame;
});

function startCD(){
  if(ST.shooting||ST.photosTaken>=4) return;
  ST.shooting=true;
  document.getElementById('shootBtn').disabled=true;
  const cd=document.getElementById('cdOv');
  cd.style.opacity='1'; let c=3; cd.textContent=c;
  const t=setInterval(()=>{
    c--;
    if(c>0){cd.textContent=c;}
    else{clearInterval(t); cd.textContent='📸'; capturePhoto();}
  },1000);
}

function capturePhoto(){
  const v=document.getElementById('videoEl');
  const fov=document.getElementById('flashOv');
  const cov=document.getElementById('cdOv');
  const cv=document.getElementById('capCv');
  const ctx=cv.getContext('2d');
  cv.width=PW; cv.height=PH;
  ctx.save(); ctx.translate(PW,0); ctx.scale(-1,1);
  ctx.drawImage(v,0,0,PW,PH);
  ctx.restore();
  drawFrame(ctx,PW,PH,ST.frame);
  const url=cv.toDataURL('image/png');
  const idx=ST.photosTaken;
  ST.photos[idx]=url; ST.photosTaken++;
  fov.style.opacity='1';
  setTimeout(()=>fov.style.opacity='0',120);
  setTimeout(()=>{cov.style.opacity='0'; cov.textContent='';},350);
  updateThumb(idx,url);
  document.getElementById('pctr').textContent=`${ST.photosTaken} / 4 枚 撮影済み`;
  ST.shooting=false;
  const sb=document.getElementById('shootBtn');
  if(ST.photosTaken>=4){sb.disabled=true;sb.querySelector('span').textContent='✅ 4枚撮影完了！';document.getElementById('goDecoBtn').disabled=false;}
  else sb.disabled=false;
}

function updateThumb(idx,url){
  const el=document.getElementById(`t${idx}`);
  el.classList.remove('cur'); el.classList.add('done');
  el.innerHTML=`<img src="${url}"><span class="tnum">${idx+1}</span>`;
  const nx=document.getElementById(`t${idx+1}`);
  if(nx) nx.classList.add('cur');
}

function goPanel(n){
  ST.currentPanel=n;
  document.querySelectorAll('.panel').forEach((p,i)=>p.classList.toggle('active',i+1===n));
  ['s1','s2','s3'].forEach((id,i)=>{
    const el=document.getElementById(id);
    el.classList.toggle('active',i+1===n);
    el.classList.toggle('done',i+1<n);
  });
  if(n===2) initDecoPanel();
  if(n===3) renderPrint();
}

// ─────────────────────────────────────────
//  DECO PANEL
// ─────────────────────────────────────────
function initDecoPanel(){
  const grid=document.getElementById('decoGrid');
  grid.innerHTML='';
  for(let i=0;i<4;i++){
    const wrap=document.createElement('div');
    wrap.className='dpwrap'; wrap.id=`dw${i}`;
    const cv=document.createElement('canvas');
    cv.id=`dc${i}`; cv.width=PW; cv.height=PH;
    const hint=document.createElement('div');
    hint.className='dphint'; hint.textContent=`写真 ${i+1}`;
    wrap.appendChild(cv); wrap.appendChild(hint);
    wrap.addEventListener('click',()=>selPhoto(i));
    grid.appendChild(wrap);
    renderDeco(i);
  }
  selPhoto(0);
  setupDrag();
}

function renderDeco(idx){
  const cv=document.getElementById(`dc${idx}`); if(!cv) return;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,PW,PH);
  // BG
  ctx.fillStyle=ST.bgColors[idx]||'#000';
  ctx.fillRect(0,0,PW,PH);
  // photo
  if(ST.photos[idx]){
    const img=new Image();
    img.onload=()=>{
      ctx.drawImage(img,0,0,PW,PH);
      drawDecoItems(ctx,idx);
    };
    img.src=ST.photos[idx];
  } else {
    drawDecoItems(ctx,idx);
  }
}

function drawDecoItems(ctx,idx){
  ST.decoData[idx].forEach(item=>{
    ctx.save();
    if(item.type==='text'){
      ctx.font=`bold ${item.size}px ${item.font}`;
      ctx.fillStyle=item.color;
      ctx.strokeStyle='rgba(0,0,0,0.55)';
      ctx.lineWidth=item.size*0.12;
      ctx.lineJoin='round';
      ctx.strokeText(item.text,item.x,item.y);
      ctx.fillText(item.text,item.x,item.y);
    } else if(item.type==='stamp'){
      // draw SVG stamp via Image
      // we store the rendered img in item.imgEl
      if(item.imgEl && item.imgEl.complete && item.imgEl.naturalWidth>0){
        ctx.drawImage(item.imgEl,item.x,item.y,item.w,item.h);
      }
    }
    ctx.restore();
  });
}

function selPhoto(idx){
  ST.selPhoto=idx;
  document.querySelectorAll('.dpwrap').forEach((w,i)=>w.classList.toggle('sel',i===idx));
  document.getElementById('selLabel').textContent=`写真 ${idx+1} を編集中 ✏️`;
}

function addText(){
  const t=document.getElementById('txtIn').value.trim(); if(!t) return;
  const idx=ST.selPhoto;
  ST.decoData[idx].push({
    type:'text', text:t,
    x:Math.random()*(PW-120)+20,
    y:Math.random()*(PH-60)+50,
    color:ST.textColor, size:ST.fontSize, font:ST.fontVal
  });
  renderDeco(idx);
  document.getElementById('txtIn').value='';
}

function addStamp(svgIdx){
  const idx=ST.selPhoto;
  const sz=Math.floor(PH*0.18);
  const item={
    type:'stamp', svgIdx,
    x:Math.random()*(PW-sz), y:Math.random()*(PH-sz),
    w:sz, h:sz, color:'#fff', size:sz,
    imgEl:null
  };
  // convert SVG to img
  const blob=new Blob([STAMPS[svgIdx].svg],{type:'image/svg+xml'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{item.imgEl=img; renderDeco(idx);};
  img.src=url;
  item.imgEl=img;
  ST.decoData[idx].push(item);
}

function clearSel(){
  ST.decoData[ST.selPhoto]=[];
  renderDeco(ST.selPhoto);
}

function undoLast(){
  const d=ST.decoData[ST.selPhoto];
  if(d.length>0){d.pop(); renderDeco(ST.selPhoto);}
}

// ─────────────────────────────────────────
//  DRAG  (canvas coord hit-test)
// ─────────────────────────────────────────
function setupDrag(){
  for(let i=0;i<4;i++){
    const cv=document.getElementById(`dc${i}`);
    if(!cv) continue;

    cv.addEventListener('mousedown', e=>onDragStart(e,'mouse',i));
    cv.addEventListener('touchstart',e=>onDragStart(e,'touch',i),{passive:false});
  }
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup',   onDragEnd);
  document.addEventListener('touchmove', e=>{if(ST.dragging) e.preventDefault(); onDragMove(e);},{passive:false});
  document.addEventListener('touchend',  onDragEnd);
}

function getCanvasPos(e,cv,isTouch){
  const rect=cv.getBoundingClientRect();
  const scaleX=PW/rect.width, scaleY=PH/rect.height;
  const clientX=isTouch? e.touches[0].clientX : e.clientX;
  const clientY=isTouch? e.touches[0].clientY : e.clientY;
  return {x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY};
}

function onDragStart(e, type, photoIdx){
  // only act on selected photo
  if(photoIdx!==ST.selPhoto) return;
  const cv=document.getElementById(`dc${photoIdx}`);
  const isTouch=type==='touch';
  const pos=getCanvasPos(e,cv,isTouch);
  const items=ST.decoData[photoIdx];
  // find topmost hit item (reverse order)
  for(let i=items.length-1;i>=0;i--){
    const item=items[i];
    let hit=false;
    if(item.type==='text'){
      // rough bounding
      const w=item.size*item.text.length*0.65;
      const h=item.size;
      hit=(pos.x>=item.x && pos.x<=item.x+w && pos.y>=item.y-h && pos.y<=item.y+4);
    } else if(item.type==='stamp'){
      hit=(pos.x>=item.x && pos.x<=item.x+item.w && pos.y>=item.y && pos.y<=item.y+item.h);
    }
    if(hit){
      if(isTouch) e.preventDefault();
      ST.dragging={photoIdx, itemIdx:i};
      ST.dragOffX=pos.x-item.x;
      ST.dragOffY=pos.y-item.y;
      return;
    }
  }
}

function onDragMove(e){
  if(!ST.dragging) return;
  const {photoIdx, itemIdx}=ST.dragging;
  const cv=document.getElementById(`dc${photoIdx}`);
  if(!cv) return;
  const isTouch=e.type.startsWith('touch');
  const pos=getCanvasPos(e,cv,isTouch);
  const item=ST.decoData[photoIdx][itemIdx];
  item.x=pos.x-ST.dragOffX;
  item.y=pos.y-ST.dragOffY;
  renderDeco(photoIdx);
}

function onDragEnd(){
  ST.dragging=null;
}

// ─────────────────────────────────────────
//  UI INIT (colors, fonts, stamps, bg)
// ─────────────────────────────────────────
function initSwatches(){
  const c=document.getElementById('swatches');
  COLORS.forEach(col=>{
    const sw=document.createElement('div');
    sw.className='sw'+(col===ST.textColor?' sel':'');
    sw.style.background=col;
    sw.style.boxShadow=`0 0 0 1.5px ${col==='#ffffff'?'#aaa':col}`;
    sw.addEventListener('click',()=>{
      ST.textColor=col;
      document.querySelectorAll('.sw').forEach(s=>s.classList.remove('sel'));
      sw.classList.add('sel');
    });
    c.appendChild(sw);
  });
}

function initFontSel(){
  const c=document.getElementById('fontSel');
  FONTS.forEach((f,i)=>{
    const btn=document.createElement('button');
    btn.className='font-btn'+(i===0?' sel':'');
    btn.textContent=f.label;
    btn.style.fontFamily=f.value;
    btn.addEventListener('click',()=>{
      ST.fontVal=f.value;
      document.querySelectorAll('.font-btn').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
    });
    c.appendChild(btn);
  });
}

function initStamps(){
  const g=document.getElementById('stampGrid');
  STAMPS.forEach((s,i)=>{
    const btn=document.createElement('div');
    btn.className='ostamp'; btn.title=s.name;
    btn.innerHTML=s.svg;
    btn.addEventListener('click',()=>addStamp(i));
    g.appendChild(btn);
  });
}

function initBgPicker(){
  const g=document.getElementById('bgPicker');
  BG_PRESETS.forEach(col=>{
    const div=document.createElement('div');
    div.className='bgcol'+(col==='#000000'?' sel':'');
    div.style.background=col;
    div.style.outline=`1px solid ${col==='#ffffff'?'#aaa':'rgba(255,255,255,.2)'}`;
    div.addEventListener('click',()=>{
      ST.bgColors[ST.selPhoto]=col;
      document.querySelectorAll('.bgcol').forEach(b=>b.classList.remove('sel'));
      div.classList.add('sel');
      renderDeco(ST.selPhoto);
    });
    g.appendChild(div);
  });
  // custom color picker
  const cw=document.createElement('div');
  cw.className='bgcol custom-wrap';
  cw.style.background='linear-gradient(135deg,#ff3d9a,#00e5ff)';
  cw.title='カスタム色';
  const inp=document.createElement('input');
  inp.type='color'; inp.value='#ff3d9a';
  inp.addEventListener('input',()=>{
    ST.bgColors[ST.selPhoto]=inp.value;
    renderDeco(ST.selPhoto);
  });
  cw.appendChild(inp);
  g.appendChild(cw);
}

document.getElementById('fsz').addEventListener('input',e=>{
  ST.fontSize=parseInt(e.target.value);
  document.getElementById('fszL').textContent=ST.fontSize;
});

// ─────────────────────────────────────────
//  PRINT
// ─────────────────────────────────────────
function renderPrint(){
  const CW=240, CH=180, PAD=14;
  const SW=CW*2+PAD*3;
  const SH=CH*2+PAD*4+36;
  const cv=document.getElementById('printCanvas');
  cv.width=SW; cv.height=SH;
  const ctx=cv.getContext('2d');

  // bg gradient
  const bg=ctx.createLinearGradient(0,0,SW,SH);
  bg.addColorStop(0,'#1A0033'); bg.addColorStop(.5,'#0A0018'); bg.addColorStop(1,'#1A0033');
  ctx.fillStyle=bg;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(0,0,SW,SH,12); else ctx.rect(0,0,SW,SH);
  ctx.fill();

  // shimmer edges
  const sh1=ctx.createLinearGradient(0,0,SW,0);
  sh1.addColorStop(0,'transparent'); sh1.addColorStop(.5,'#FF3D9A'); sh1.addColorStop(1,'transparent');
  ctx.fillStyle=sh1;
  ctx.fillRect(0,0,SW,2); ctx.fillRect(0,SH-2,SW,2);

  const positions=[[PAD,PAD],[PAD*2+CW,PAD],[PAD,PAD*2+CH],[PAD*2+CW,PAD*2+CH]];
  let drawn=0;

  function tryFinish(){
    drawn++;
    if(drawn<4) return;
    // bottom text
    ctx.font=`bold 10px 'Reggae One',sans-serif`;
    ctx.fillStyle='#FF3D9A';
    ctx.textAlign='center';
    ctx.shadowColor='#FF3D9A'; ctx.shadowBlur=6;
    ctx.fillText('★ PURIKURA STUDIO ★',SW/2,SH-PAD-10);
    ctx.shadowBlur=0;
    ctx.font=`8px 'DotGothic16',monospace`;
    ctx.fillStyle='rgba(255,255,255,.35)';
    const d=new Date();
    ctx.fillText(`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`,SW/2,SH-PAD+2);
  }

  for(let i=0;i<4;i++){
    const src=document.getElementById(`dc${i}`);
    const [x,y]=positions[i];
    // white border
    ctx.fillStyle='rgba(255,255,255,.88)';
    ctx.fillRect(x-3,y-3,CW+6,CH+6);
    if(src){
      ctx.drawImage(src,x,y,CW,CH);
      tryFinish();
    } else tryFinish();
  }
}

function download(){
  renderPrint();
  setTimeout(()=>{
    const cv=document.getElementById('printCanvas');
    const a=document.createElement('a');
    a.download=`purikura_${Date.now()}.png`;
    a.href=cv.toDataURL('image/png');
    a.click();
  },120);
}

// ─────────────────────────────────────────
//  BOOT
// ─────────────────────────────────────────
initCam();
initSwatches();
initFontSel();
initStamps();
initBgPicker();
</script>
